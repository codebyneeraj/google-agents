[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-cli"
version = "1.0.0"
description = "Agentic CLI Terminal Frontend for Secure SOC Analyst Orchestrator on Gemini Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "httpx>=0.27.0",
    "tomlkit>=0.12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
soc = "soc_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["soc_cli*", "src*"]
